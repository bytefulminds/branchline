<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    macOS app icon source. Follows Apple's icon grid: the body is 824 x 824 at (100, 100) with a
    185 px corner radius, leaving room for the shadow. Rebuild icon.icns with
    `python3 src-tauri/icons/macos/build.py` after editing.
  -->
  <defs>
    <!-- Body: slightly lighter at the top, like light falling on the tile. -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a52" />
      <stop offset="0.5" stop-color="#1e293b" />
      <stop offset="1" stop-color="#162030" />
    </linearGradient>
    <!-- Bright rim along the top, fading out at the sides and returning faintly at the bottom. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62" />
      <stop offset="0.16" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="0.86" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.26" />
    </linearGradient>
    <!-- Soft sheen in the top half for depth. -->
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.9" fx="0.5" fy="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dy="12" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.38" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dy="5" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" />
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)" />

  <!-- Logo mark: the 100-unit LogoMark scaled to the tile. -->
  <g transform="translate(100 100) scale(8.24)" filter="url(#nodeShadow)">
    <g fill="none" stroke="#f1f5f9" stroke-width="3.8" stroke-linecap="round">
      <path d="M25.8 21.4V78.6" />
      <path d="M25.8 38H33C43 38 46 25.3 57 25.3H74.7" />
      <path d="M25.8 62.5H33C43 62.5 46 74.1 57 74.1H74.7" />
    </g>
    <g fill="#f1f5f9">
      <circle cx="25.8" cy="21.4" r="8.2" />
      <circle cx="25.8" cy="50.2" r="8.2" />
      <circle cx="25.8" cy="78.6" r="8.2" />
      <circle cx="74.7" cy="25.3" r="8.2" />
      <circle cx="74.7" cy="74.1" r="8.2" />
    </g>
    <g fill="#5ccf9e">
      <circle cx="25.8" cy="21.4" r="5.8" />
      <circle cx="25.8" cy="50.2" r="5.8" />
      <circle cx="25.8" cy="78.6" r="5.8" />
      <circle cx="74.7" cy="25.3" r="5.8" />
      <circle cx="74.7" cy="74.1" r="5.8" />
    </g>
  </g>

  <!-- Shining edge: an inner stroke clipped to the tile, brightest at the top. -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="url(#rim)"
      stroke-width="9" />
  </g>
  <!-- Thin dark outline so the tile separates from dark wallpapers and the Dock. -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000000"
    stroke-opacity="0.35" stroke-width="1" />
</svg>
