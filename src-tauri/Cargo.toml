[package]
name = "branchline"
version = "0.2.5"
description = "Branchline: a fast, local-first, open-source Git desktop client"
authors = ["Branchline contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "branchline_lib"
# Desktop only: the static and dynamic library types are for mobile builds, and building
# them for every test run cost over a gigabyte of disk.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
ignore = "0.4"
ureq = { version = "3", features = ["json"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

# Tokens for GitLab (and later other services) live in the system's credential store:
# macOS Keychain, Windows Credential Manager, the Secret Service on Linux (pure Rust).
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies.keyring]
version = "3"
features = ["async-secret-service", "async-io", "crypto-rust"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSGeometry",
  "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[dev-dependencies]
tempfile = "3"

# Tests and debug builds keep line numbers for backtraces but no full debug info: with it,
# every integration test binary (each links Tauri and WebKit) was about 350 MB, and CI runners
# ran out of disk while linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
