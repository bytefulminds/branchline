[package]
name = "branchline"
version = "0.1.0"
description = "Branchline: a fast, local-first, open-source Git desktop client"
authors = ["Branchline contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "branchline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
ignore = "0.4"
ureq = { version = "3", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSGeometry",
  "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
