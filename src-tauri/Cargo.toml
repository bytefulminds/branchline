[package]
name = "branchline"
version = "0.1.0"
description = "Branchline: a fast, local-first, open-source Git desktop client"
authors = ["Branchline contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "branchline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
